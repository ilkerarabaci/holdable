name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "Also build a profile APK (for perf measurement)"
        type: boolean
        default: true
      ios:
        description: "iOS compile check (unsigned; macOS runner = 10x minutes)"
        type: boolean
        default: false
      ios_sim:
        description: "iOS Simulator smoke: boot app + screenshot (macOS 10x minutes)"
        type: boolean
        default: false

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Thermion's native build hook compiles its C++ for the host during
      # `flutter test`; provide a C++ stdlib so it can find <chrono> etc.
      - name: Install C++ toolchain (Thermion native build)
        run: sudo apt-get update && sudo apt-get install -y clang g++ libc++-dev libc++abi-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libgbm-dev libdrm-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Build debug APK
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install C++ toolchain (Thermion native build)
        run: sudo apt-get update && sudo apt-get install -y clang g++ libc++-dev libc++abi-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libgbm-dev libdrm-dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # CONVERT_API_KEY: shared-secret for the public conversion endpoint (repo
      # secret; unset ⇒ empty ⇒ the app sends no key, matching a server with
      # auth off — so enabling auth is a two-step, no-breakage rollout).
      - run: flutter build apk --debug --dart-define=CONVERT_API_KEY=${{ secrets.CONVERT_API_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: holdable-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-profile:
    name: Build profile APK
    needs: analyze-test
    # Only on manual dispatch — profile build is for perf measurement, not every push.
    if: github.event_name == 'workflow_dispatch' && inputs.profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # arm64-only profile APK via --split-per-abi (the canonical single-ABI
      # build). `--target-platform android-arm64` only slimmed Flutter's own
      # libapp/libflutter; the plugin natives (thermion + arsceneview Filament,
      # ARCore) still shipped armv7 + x86_64 dead weight (~13MB), and a
      # defaultConfig `abiFilters += arm64` didn't strip them. --split-per-abi
      # emits one APK per ABI containing only that ABI's libs — we ship arm64.
      # (Play distribution should use an AAB; this keeps the sideload APK lean.
      # Floor is ~73MB: two Filament renderers + Flutter engine + ARCore.)
      - run: flutter build apk --profile --split-per-abi --dart-define=CONVERT_API_KEY=${{ secrets.CONVERT_API_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: holdable-profile-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-profile.apk
          if-no-files-found: error

  build-ios-check:
    name: iOS compile check (unsigned)
    # i0 de-risk spike: does the whole plugin stack (thermion native hooks,
    # ar_flutter_plugin_2 pods, file_picker, drift/sqlite3) even COMPILE for
    # iOS? Manual dispatch only — a macOS runner burns Actions minutes at 10x,
    # so this must never run on every push.
    needs: analyze-test
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign --debug --dart-define=CONVERT_API_KEY=${{ secrets.CONVERT_API_KEY }}
      # Surface the app bundle size in the job log (rough IPA-floor signal).
      - run: du -sh build/ios/iphoneos/Runner.app || true

  ios-sim-smoke:
    name: iOS Simulator smoke (no signing, no Apple account)
    # i0.5: prove the app BOOTS on iOS without paying for a developer account —
    # simulator builds need no codesigning. Boots an iPhone simulator on the
    # macOS runner, installs the app, launches it and uploads a screenshot.
    # Manual dispatch only (macOS = 10x minutes).
    needs: analyze-test
    if: github.event_name == 'workflow_dispatch' && inputs.ios_sim
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --dart-define=CONVERT_API_KEY=${{ secrets.CONVERT_API_KEY }}
      - name: Boot simulator, install, launch, screenshot
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(dev['udid'] for rt,devs in sorted(d.items(),reverse=True) if 'iOS' in rt for dev in devs if 'iPhone' in dev['name']))")
          echo "using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" app.holdable
          sleep 30
          xcrun simctl io "$UDID" screenshot ios-sim-screenshot.png
      - uses: actions/upload-artifact@v7
        with:
          name: ios-sim-screenshot
          path: ios-sim-screenshot.png
          if-no-files-found: error
