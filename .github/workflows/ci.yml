name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "Also build a profile APK (for perf measurement)"
        type: boolean
        default: true

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Thermion's native build hook compiles its C++ for the host during
      # `flutter test`; provide a C++ stdlib so it can find <chrono> etc.
      - name: Install C++ toolchain (Thermion native build)
        run: sudo apt-get update && sudo apt-get install -y clang g++ libc++-dev libc++abi-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libgbm-dev libdrm-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Build debug APK
    # Temporarily decoupled from analyze-test to verify the Thermion ANDROID
    # build independently (the host build that `flutter test` triggers is a
    # separate concern). Re-add `needs: analyze-test` once tests are green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install C++ toolchain (Thermion native build)
        run: sudo apt-get update && sudo apt-get install -y clang g++ libc++-dev libc++abi-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libgbm-dev libdrm-dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: holdable-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-profile:
    name: Build profile APK
    needs: analyze-test
    # Only on manual dispatch — profile build is for perf measurement, not every push.
    if: github.event_name == 'workflow_dispatch' && inputs.profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --profile
      - uses: actions/upload-artifact@v7
        with:
          name: holdable-profile-apk
          path: build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
