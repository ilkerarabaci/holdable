<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0E0E10; }
  #c { width: 100vw; height: 100vh; display: block; touch-action: none; }
  #status {
    position: fixed; left: 0; right: 0; bottom: 16px; text-align: center;
    font-family: ui-monospace, monospace; font-size: 12px; color: #8A8A95;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">loading engine…</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const statusEl = document.getElementById('status');
function post(msg) { try { ModelChannel.postMessage(msg); } catch (e) {} }
function setStatus(s) { statusEl.textContent = s; }

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, preserveDrawingBuffer: true,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0E0E10);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 5000);
camera.position.set(0, 0, 5);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
// Stop auto-spin on interaction, resume after idle.
let idleTimer = null;
controls.addEventListener('start', () => {
  controls.autoRotate = false;
  if (idleTimer) clearTimeout(idleTimer);
});
controls.addEventListener('end', () => {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { controls.autoRotate = true; }, 1400);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x8B6CFF, 0.5);
rim.position.set(-4, -2, -3);
scene.add(rim);

let current = null;
let fitDist = 5;
const material = new THREE.MeshStandardMaterial({
  color: 0xd8d8de, metalness: 0.1, roughness: 0.55, flatShading: false,
});

// Theme-aware canvas: keep the viewer consistent with the app theme instead
// of always-dark. In light mode the model is darkened so it contrasts.
window.setTheme = function (mode) {
  if (mode === 'light') {
    scene.background = new THREE.Color(0xEDEBE6);
    material.color.setHex(0x8A9099);
    document.body.style.background = '#EDEBE6';
  } else {
    scene.background = new THREE.Color(0x0E0E10);
    material.color.setHex(0xD8D8DE);
    document.body.style.background = '#0E0E10';
  }
  material.needsUpdate = true;
};

// Render modes (product-spec: Solid / Wireframe / X-ray).
window.setRenderMode = function (mode) {
  if (mode === 'wireframe') {
    material.wireframe = true; material.transparent = false; material.opacity = 1;
    material.depthWrite = true;
  } else if (mode === 'xray') {
    material.wireframe = false; material.transparent = true; material.opacity = 0.35;
    material.depthWrite = false;
  } else { // solid
    material.wireframe = false; material.transparent = false; material.opacity = 1;
    material.depthWrite = true;
  }
  material.needsUpdate = true;
};

// Preset camera views.
window.setView = function (which) {
  const d = fitDist;
  controls.autoRotate = false;
  if (which === 'top') camera.position.set(0, d, 0.0001);
  else if (which === 'side') camera.position.set(d, 0, 0);
  else if (which === 'iso') camera.position.set(d * 0.6, d * 0.6, d * 0.6);
  else camera.position.set(0, 0, d); // front
  controls.target.set(0, 0, 0);
  controls.update();
};

function frameObject(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center); // center at origin
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim / (2 * Math.tan((Math.PI * camera.fov) / 360));
  fitDist = dist * 1.6;
  // Default to an iso angle so even boxy/flat models read as 3D (a dead-front
  // view of a cube is a flat square; the thumbnail captured here would look
  // blank/2D). Preset 'Front' is still available from the View tab.
  camera.position.set(fitDist * 0.62, fitDist * 0.52, fitDist * 0.62);
  camera.near = maxDim / 100;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
  return { size, maxDim };
}

function countTris(obj) {
  let tris = 0, verts = 0;
  obj.traverse((ch) => {
    if (ch.isMesh && ch.geometry) {
      const g = ch.geometry;
      const pos = g.attributes.position;
      verts += pos ? pos.count : 0;
      tris += g.index ? g.index.count / 3 : (pos ? pos.count / 3 : 0);
    }
  });
  return { tris: Math.round(tris), verts };
}

// Chunked transfer for large files: Dart appends base64 chunks (each well
// under Android's ~1MB binder limit), then calls loadChunked to assemble +
// parse. A single huge runJavaScript arg would throw TransactionTooLargeException.
window.__chunks = [];
window.appendChunk = function (s) { window.__chunks.push(s); };
window.loadChunked = function (format) {
  const b64 = window.__chunks.join('');
  window.__chunks = [];
  window.loadModel(format, b64);
};

// Called from Dart: window.loadModel('stl'|'obj', base64String)
window.loadModel = function (format, b64) {
  try {
    setStatus('parsing ' + format + '…');
    const bin = atob(b64);
    b64 = null; // free the base64 string (~1.33x file size) before geometry alloc
    const len = bin.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);

    // Free the previous model's CPU+GPU buffers (matters on prev/next nav).
    if (current) {
      current.traverse((o) => { if (o.isMesh && o.geometry) o.geometry.dispose(); });
      scene.remove(current);
      current = null;
    }
    const t0 = performance.now();
    let obj;
    if (format === 'stl') {
      let geom = new STLLoader().parse(bytes.buffer);
      // STL is non-indexed (positions = 3x triangles). Weld shared vertices
      // into an indexed geometry — ~3x less geometry memory on closed meshes —
      // then compute smooth normals over the smaller vertex set.
      geom = mergeVertices(geom);
      geom.computeVertexNormals();
      obj = new THREE.Mesh(geom, material);
    } else {
      const text = new TextDecoder().decode(bytes);
      obj = new OBJLoader().parse(text);
      obj.traverse((ch) => { if (ch.isMesh) ch.material = material; });
    }
    scene.add(obj);
    current = obj;
    const { maxDim } = frameObject(obj);
    const stats = countTris(obj);
    const ms = Math.round(performance.now() - t0);
    setStatus('');
    post(JSON.stringify({ type: 'loaded', tris: stats.tris, verts: stats.verts, ms }));
    // Capture a 256px thumbnail once the first frame is on screen.
    setTimeout(captureThumb, 250);
  } catch (e) {
    setStatus('failed to render');
    post(JSON.stringify({ type: 'error', message: '' + e }));
  }
};

// Renders into a 256x256 offscreen canvas and posts a base64 PNG thumbnail.
function captureThumb() {
  try {
    renderer.render(scene, camera);
    const tc = document.createElement('canvas');
    tc.width = 256; tc.height = 256;
    const ctx = tc.getContext('2d');
    ctx.fillStyle = '#0E0E10';
    ctx.fillRect(0, 0, 256, 256);
    const side = Math.min(canvas.width, canvas.height);
    const sx = (canvas.width - side) / 2;
    const sy = (canvas.height - side) / 2;
    ctx.drawImage(canvas, sx, sy, side, side, 0, 0, 256, 256);
    const url = tc.toDataURL('image/png');
    post(JSON.stringify({ type: 'thumb', data: url.split(',')[1] }));
  } catch (e) {/* thumbnail is best-effort */}
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}
function animate() {
  resize();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
setStatus('ready');
post('ready');
</script>
</body>
</html>
